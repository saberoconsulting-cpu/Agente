name: sabero-platform
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: sabero_control
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks: [sabero]
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-platform}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks: [sabero]
    restart: unless-stopped
  platform:
    build: .
    env_file: .env.runtime
    environment:
      HOST: 0.0.0.0
    networks: [sabero]
    expose: ["3010"]
    depends_on: [postgres, mongo]
    restart: unless-stopped
networks:
  sabero:
    name: sabero
volumes:
  postgres-data:
  mongo-data:
