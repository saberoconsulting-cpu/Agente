name: sabero-local
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres.local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local password required}
      POSTGRES_DB: sabero_control
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sabero_control"]
      interval: 3s
      timeout: 3s
      retries: 40
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: platform
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Local password required}
    ports: ["127.0.0.1:57017:27017"]
    volumes: ["mongo-data:/data/db"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  postgres-data:
  mongo-data:
