services:
  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    command: ["npm", "run", "db:migrate:prod"]
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    command: ["npm", "run", "start:worker"]
    depends_on:
      backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
