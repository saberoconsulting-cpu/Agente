upstream sabero_frontend {
  server frontend:3000;
}

upstream sabero_backend {
  server backend:3001;
}

server {
  listen 80;
  server_name agente.saberoconsulting.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name agente.saberoconsulting.com;

  ssl_certificate /etc/letsencrypt/live/agente.saberoconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agente.saberoconsulting.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 2m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  proxy_hide_header Cross-Origin-Opener-Policy;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://connect.facebook.net; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://content.googleapis.com https://graph.facebook.com; frame-src https://accounts.google.com https://docs.google.com https://content.googleapis.com https://www.facebook.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;" always;

  location /api/ {
    proxy_pass http://sabero_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /integrations/google/callback {
    proxy_pass http://sabero_backend/integrations/google/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://sabero_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
