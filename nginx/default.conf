upstream sabero_frontend {
  server frontend:3000;
}

upstream sabero_backend {
  server backend:3001;
}

server {
  listen 80;
  server_name agent.saberoconsulting.com www.agent.saberoconsulting.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name agent.saberoconsulting.com www.agent.saberoconsulting.com;

  ssl_certificate /etc/letsencrypt/live/agent.saberoconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agent.saberoconsulting.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 2m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://connect.facebook.net; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://graph.facebook.com; frame-src https://accounts.google.com https://www.facebook.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline';" always;

  location /api/ {
    proxy_pass http://sabero_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /integrations/google/callback {
    proxy_pass http://sabero_backend/integrations/google/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://sabero_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
