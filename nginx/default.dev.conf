upstream sabero_frontend { server frontend:3000; }
upstream sabero_backend { server backend:3001; }

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://sabero_backend/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /integrations/google/callback {
    proxy_pass http://sabero_backend/integrations/google/callback;
    proxy_set_header Host $host;
  }
  location / { proxy_pass http://sabero_frontend; }
}
