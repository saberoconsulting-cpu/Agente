services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_SSL_CA_FILE: /certs/supabase-ca.pem
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped
    expose:
      - "3001"
    networks: [default, sabero]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_PROXY_TARGET: http://backend:3001
    environment:
      HOSTNAME: "0.0.0.0"
    env_file:
      - ./frontend/.env.production
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks: [default, sabero]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_SSL_CA_FILE: /certs/supabase-ca.pem
    volumes:
      - ./certs:/certs:ro
    command: ["npm", "run", "start:worker"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [default, sabero]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    networks: [default, sabero]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

networks:
  sabero:
    external: true
    name: sabero
